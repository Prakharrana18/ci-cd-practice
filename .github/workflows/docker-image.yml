name: Docker Build -> Push -> deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SetUp java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build a jar
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests
        
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/ci-demo:latest .

    - name: Push Image to Docker Hub
      run: docker push  ${{secrets.DOCKERHUB_USERNAME}}/ci-demo:latest

    - name: SSH and deploy to Ec2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST_1 }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY_1 }}
        port: ${{ secrets.PORT }}
        script: |
          docker stop ci-demo | true
          delete rm ci-demo | true
          docker pull ${{secrets.DOCKERHUB_USERNAME}}/ci-demo:latest
          docker run -d --name ci-demo -p 8081:8081 ${{secrets.DOCKERHUB_USERNAME}}/ci-demo:latest
          ls -al
    
